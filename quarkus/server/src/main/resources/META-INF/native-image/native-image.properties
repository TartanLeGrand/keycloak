# GraalVM native image configuration for Keycloak
# Configure native image build for GraalVM compatibility
Args = --report-unsupported-elements-at-runtime \
       --allow-incomplete-classpath \
       -H:+ReportUnsupportedElementsAtRuntime \
       --initialize-at-run-time=io.quarkus.runner.ApplicationImpl \
       --initialize-at-run-time=org.keycloak.common.crypto.CryptoIntegration \
       --initialize-at-run-time=org.keycloak.common.util.BouncyIntegration \
       --initialize-at-run-time=org.keycloak.services.resources.KeycloakApplication