# Inherit all configuration from the default runtime settings and sets those specific to the distribution

quarkus.package.output-name=keycloak
quarkus.package.jar.type=mutable-jar
quarkus.package.output-directory=lib
quarkus.package.jar.user-providers-directory=../providers
quarkus.package.main-class=keycloak

# Native image configuration
%native.quarkus.native.additional-build-args=-H:+ReportUnsupportedElementsAtRuntime,--allow-incomplete-classpath,--report-unsupported-elements-at-runtime,-H:-UseServiceLoaderFeature
%native.quarkus.native.enable-fallback-images=false
%native.quarkus.native.enable-reports=true

# Disable Oracle JDBC extension for native builds as it requires additional native configuration
%native.quarkus.datasource.db-kind=h2
%native.quarkus.native.excluded-features=oracle.jdbc.nativeimage.NativeImageFeature