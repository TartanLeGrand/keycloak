# Inherit all configuration from the default runtime settings and sets those specific to the distribution

quarkus.package.output-name=keycloak
quarkus.package.jar.type=mutable-jar
quarkus.package.output-directory=lib
quarkus.package.jar.user-providers-directory=../providers
quarkus.package.main-class=keycloak

# Native image configuration
%native.quarkus.native.additional-build-args=-H:+ReportUnsupportedElementsAtRuntime,--allow-incomplete-classpath,--report-unsupported-elements-at-runtime,--initialize-at-run-time=org.keycloak.common.crypto.CryptoIntegration,--initialize-at-run-time=org.keycloak.common.util.BouncyIntegration,--initialize-at-run-time=org.keycloak.services.resources.KeycloakApplication
%native.quarkus.native.enable-fallback-images=false
%native.quarkus.native.enable-reports=true

# Use H2 database for native builds (Oracle JDBC excluded for GraalVM compatibility)
%native.quarkus.datasource.db-kind=h2

# Configuration for native builds to handle hostname requirements during build
%native.hostname=localhost
%native.hostname-strict=false